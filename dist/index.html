<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Traversée</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mystery+Quest&family=Fondamento&display=swap" rel="stylesheet"><style>:root{--fond:#0f0b18;--verre:rgba(24,18,40,.82);--texte:#f3ecdc;--or:#f0c766;--bord:rgba(240,199,102,.35);--doux:#a99fc4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1f45,var(--fond) 70%);color:var(--texte);font-family:"Fondamento",Georgia,serif;display:flex;justify-content:center}
#jeu{width:min(980px,100vw);padding:12px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-family:"Mystery Quest",cursive;font-weight:normal;letter-spacing:.04em;color:var(--or);font-size:clamp(24px,4vw,36px);margin:0;text-shadow:0 0 12px rgba(240,199,102,.55),0 2px 0 #5a3a10;transform:rotate(-2deg)}
#scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #0009,0 0 0 1px var(--bord)}
#cv{width:100%;height:100%;image-rendering:pixelated;display:block;cursor:crosshair;touch-action:manipulation}
.panneau{background:var(--verre);backdrop-filter:blur(8px);border:1px solid var(--bord);border-radius:12px}
#bulle,#choix{position:absolute;left:3%;right:3%;bottom:4%;background:var(--verre);backdrop-filter:blur(8px);border:1px solid var(--bord);border-radius:12px;padding:12px 16px;font-size:clamp(13px,2vw,17px);line-height:1.4;animation:monte .18s ease-out}
#bulle{cursor:pointer}#bulle b{display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
#bulle::after{content:"▸";position:absolute;right:12px;bottom:8px;color:var(--or);animation:clig 1s infinite}
#choix .tete{opacity:.7;margin-bottom:8px;font-size:.9em}
#choix button{display:block;width:100%;text-align:left;margin:4px 0;border-radius:8px}
#info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--verre);border-radius:20px;padding:4px 14px;font-size:14px;pointer-events:none}
#info:empty{display:none}
#etiquette{position:absolute;pointer-events:none;background:#000b;padding:3px 8px;border-radius:6px;font-size:13px;white-space:nowrap}
#roue{position:absolute;width:160px;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;background:var(--verre);backdrop-filter:blur(8px);border:1px solid var(--bord);border-radius:14px;animation:monte .12s}
#roue .titre{grid-column:1/-1;text-align:center;font-size:12px;color:var(--doux)}
#roue button{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 2px;border-radius:10px}
#roue span{font-size:18px}
button{font:inherit;background:#2a2142;color:var(--texte);border:1px solid transparent;padding:6px 10px;cursor:pointer;transition:.15s}
button:hover{background:#3b2f5e;border-color:var(--bord)}
#inv{display:flex;gap:8px;margin-top:10px;padding:8px;min-height:64px;background:var(--verre);border:1px solid var(--bord);border-radius:12px;overflow-x:auto}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;border-radius:10px;font-size:11px}
.slot canvas{width:30px;height:30px;image-rendering:pixelated}
.slot.on{background:var(--or);color:#1b1407;box-shadow:0 0 12px var(--or)}
.vide{color:var(--doux);align-self:center;font-size:13px}
#heros{display:flex;gap:8px}
.avatar{width:38px;height:38px;border-radius:50%;padding:0;font-weight:bold;border:2px solid var(--c);color:var(--c);background:#1a1430}
.avatar.on{background:var(--c);color:#1a1430;transform:scale(1.1)}
.aide{color:var(--doux);font-size:12px;text-align:center;margin:8px 0 0}
@keyframes monte{from{transform:translateY(6px);opacity:0}}
@keyframes clig{50%{opacity:0}}
#passer{position:absolute;top:10px;right:10px;border-radius:20px;background:var(--verre);border:1px solid var(--bord);font-size:13px;z-index:2}
.avatar{font-family:"Mystery Quest",cursive}
#bulle b{font-family:"Mystery Quest",cursive;font-size:1.25em;letter-spacing:.04em;text-transform:none;text-shadow:0 1px 0 #000,0 0 10px currentColor}
#bulle,#choix{font-size:clamp(16px,2.5vw,21px);line-height:1.45;color:#fff8e8;text-shadow:0 1px 2px #000;background:rgba(14,10,26,.92)}
.avatar{font-size:18px}
</style></head>
<body>
<div id="jeu">
  <header><h1>La Traversée</h1><div id="heros"></div></header>
  <div id="scene"><canvas id="cv" width="320" height="180"></canvas>
    <div id="info"></div><div id="etiquette" hidden></div><div id="roue" hidden></div>
    <div id="bulle" hidden></div><button id="passer" hidden title="Échap">Passer ⏭</button><div id="choix" hidden></div></div>
  <div id="inv"></div>
  <p class="aide">Clic : action · Clic droit / appui long : plus d'actions · Objet puis cible : utiliser ou donner</p>
</div>
<script>// ===== Moteur point and click =====
const W=320,H=180,SOL=160;
const TEST=typeof window!=='undefined'&&window.TEST;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
const S={scene:null,perso:'yvan',f:{},verbe:'regarder',sel:null,busy:false,
  persos:{yvan:{inv:['telephone']},rod:{inv:['echarpe']},solene:{inv:['billets','tetine']}},
  pos:{yvan:70,rod:110,solene:150},cache:{}};
const NOMS={yvan:'Yvan',rod:'Rod',solene:'Solène'};
const COUL={yvan:'#9fd3ff',rod:'#ff8a7a',solene:'#ffd27a',narr:'#cfc6e6'};
const VERBES={regarder:'Regarder',prendre:'Prendre',utiliser:'Utiliser',parler:'Parler',donner:'Donner'};
const DEF={regarder:"Rien de spécial.",prendre:"Je ne peux pas prendre ça.",utiliser:"Ça ne donne rien.",
  parler:"Ça ne répond pas. Heureusement.",donnerSansObjet:"Donner quoi ? Choisis d'abord un objet.",
  donnerPasHumain:"On ne donne pas d'objets à ce qui n'est pas une personne.",donnerRefus:"Non merci, garde-le.",
  utiliserSurPersonne:"Pour une personne, essaie plutôt Donner."};
const OBJETS={}; // id -> {nom, icone(g)}
const SCENES={};
const R=(x,y,w,h,c,ctx=g)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};

// ----- Dialogues -----
let clicSuivant=null;
function say(qui,txt){
  const q=qui==='moi'?S.perso:qui;
  const b=$('bulle');b.innerHTML=`<b style="color:${COUL[q]||COUL.narr}">${NOMS[q]||''}</b>${txt}`;b.hidden=false;
  S.derniere=b.innerHTML;
  if(TEST)TEST.log.push(q+': '+txt);
  if((TEST&&!TEST.lent)||S.passe){b.hidden=true;return Promise.resolve()}
  $('passer').hidden=false;
  return new Promise(r=>{clicSuivant=()=>{b.hidden=true;$('passer').hidden=true;clicSuivant=null;r()}});
}
async function dire(lignes){for(const[q,t]of lignes)await say(q,t)}
function choose(opts){ // opts: [[texte,valeur],...]
  S.passe=false;$('passer').hidden=true;
  if(TEST){const v=TEST.choix.shift();return Promise.resolve(v===undefined?opts[0][1]:v)}
  const c=$('choix');c.innerHTML=`<div class="tete">${S.derniere||''}</div>`;c.hidden=false;
  return new Promise(r=>opts.forEach(([t,v])=>{const b=document.createElement('button');b.textContent=t;
    b.onclick=e=>{e.stopPropagation();c.hidden=true;r(v)};c.appendChild(b)}));
}
// Passer : saute toute la séquence de dialogue en cours (s'arrête au prochain choix)
function passer(){if(!clicSuivant)return;S.passe=true;clicSuivant()}
$('passer').onclick=e=>{e.stopPropagation();passer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')passer();else if((e.key===' '||e.key==='Enter')&&clicSuivant){e.preventDefault();clicSuivant()}});
$('bulle').onclick=e=>{e.stopPropagation();clicSuivant&&clicSuivant()};

// ----- Inventaire -----
const inv=()=>S.persos[S.perso].inv;
const aObjet=(o,p=S.perso)=>S.persos[p].inv.includes(o);
function ajouter(o,p=S.perso){if(!aObjet(o,p))S.persos[p].inv.push(o);ui()}
function retirer(o,p=S.perso){const i=S.persos[p].inv.indexOf(o);if(i>=0)S.persos[p].inv.splice(i,1);if(S.sel===o)S.sel=null;ui()}
function switchPerso(n){if(S.busy)return;S.perso=n;S.sel=null;ui()}

// ----- Interface (sans barre de verbes) -----
const ICONES={regarder:'👁',prendre:'✋',utiliser:'⚙',parler:'💬'};
function ui(){
  $('inv').innerHTML='';for(const o of inv()){const b=document.createElement('button');b.className='slot'+(S.sel===o?' on':'');
    const c=document.createElement('canvas');c.width=12;c.height=12;OBJETS[o].icone(c.getContext('2d'));
    const l=document.createElement('span');l.textContent=OBJETS[o].nom;b.append(c,l);b.title=OBJETS[o].nom;
    b.onclick=()=>clicObjetInv(o);b.oncontextmenu=e=>{e.preventDefault();regarderInv(o)};$('inv').appendChild(b)}
  if(!inv().length)$('inv').innerHTML='<span class="vide">Inventaire vide</span>';
  $('heros').innerHTML='';for(const n in NOMS){const b=document.createElement('button');b.className='avatar'+(S.perso===n?' on':'');
    b.style.setProperty('--c',COUL[n]);b.textContent=NOMS[n][0];b.title=NOMS[n];b.onclick=()=>switchPerso(n);$('heros').appendChild(b)}
  info();
}
function info(){$('info').textContent=S.sel?`${OBJETS[S.sel].nom} → sur quoi ?`:''}
async function regarderInv(o){if(S.busy)return;S.busy=true;await say('moi',OBJETS[o].desc||OBJETS[o].nom);S.busy=false}
function clicObjetInv(o){if(S.busy)return;S.sel=S.sel===o?null:o;ui()}
function verbeParDefaut(o){if(S.sel)return o.humain?'donner':'utiliser';return o.defaut||(o.humain?'parler':o.utiliser||o.with?'utiliser':'regarder')}
// ----- Scène -----
function heroObjets(){
  const sc=SCENES[S.scene];return Object.keys(NOMS).filter(n=>n!==S.perso&&S.pos[n]!=null).map(n=>({
    id:n,nom:NOMS[n],humain:true,x:S.pos[n]-7,y:SOL-40,w:14,h:40,...(sc.heros?.[n]||{}),
    regarder:sc.heros?.[n]?.regarder||PORTRAITS[n]}));
}
const PORTRAITS={yvan:"Yvan. Lunettes, moustache, sac de parc d'attractions. Ex-guitariste du groupe.",
  rod:"Rod. Barbe, pull rouge, avis tranché sur le foot, le rap et la politique.",
  solene:"Solène. Psy, lectrice de BD compulsive, et maman toute neuve de Raphaël."};
function objetsCliquables(){const sc=SCENES[S.scene];return[...(sc.objets||[]).filter(o=>!o.cache||!o.cache()),...heroObjets()]}
function dessiner(){
  const sc=SCENES[S.scene];if(TEST)return;requestAnimationFrame(dessiner);if(!sc)return;g.clearRect(0,0,W,H);sc.dessin(g);
  (sc.objets||[]).forEach(o=>o.dessin&&(!o.cache||!o.cache())&&o.dessin(g));
  sc.reflet&&reflets();
  Object.keys(NOMS).filter(n=>S.pos[n]!=null).sort((a,b)=>S.pos[a]-S.pos[b]).forEach(n=>drawPerso(n,S.pos[n]));
  postEffets(sc);
  if(S.flash>0){g.fillStyle=`rgba(255,255,255,${S.flash})`;g.fillRect(0,0,W,H);S.flash-=.05}
}
function marcher(n,x){x=Math.max(8,Math.min(W-8,x));if(TEST){S.pos[n]=x;return Promise.resolve()}return new Promise(r=>{const pas=()=>{
  const d=x-S.pos[n];if(Math.abs(d)<2){S.pos[n]=x;return r()}S.pos[n]+=Math.sign(d)*2;setTimeout(pas,16)};pas()})}
const pause=ms=>TEST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
async function go(id,positions){S.scene=id;if(positions)Object.assign(S.pos,positions);S.sel=null;ui();
  const sc=SCENES[id];if(sc.entree&&!S.f['vu_'+id]){S.f['vu_'+id]=1;S.busy=true;await sc.entree();S.busy=false;S.passe=false}}

async function lancer(h){if(typeof h==='string')await say('moi',h);else await h()}
async function agir(o,v=verbeParDefaut(o)){
  if(!o.loin){const cx=o.x+o.w/2;if(Math.abs(S.pos[S.perso]-cx)>20)await marcher(S.perso,cx+(S.pos[S.perso]<cx?-16:16))}
  if(v==='donner'){
    if(!S.sel)return say('moi',DEF.donnerSansObjet);
    if(!o.humain&&!o.giveOK)return say('moi',DEF.donnerPasHumain);
    return lancer(o.with?.[S.sel]||DEF.donnerRefus);
  }
  if(v==='utiliser'&&S.sel){
    if(o.humain&&!o.useOK)return say('moi',DEF.utiliserSurPersonne);
    return lancer(o.with?.[S.sel]||DEF.utiliser);
  }
  return lancer(o[v]||DEF[v]);
}
function cible(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  return{x,y,o:objetsCliquables().reverse().find(o=>x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)}}
async function executer(o,v,x){S.busy=true;fermerRoue();$('etiquette').hidden=true;
  try{if(o)await agir(o,v);else{S.sel=null;await marcher(S.perso,x)}}finally{S.busy=false;S.passe=false;if(o&&S.sel&&v!=='regarder')S.sel=null;ui()}}
function fermerRoue(){$('roue').hidden=true}
function ouvrirRoue(e,o){const r=$('scene').getBoundingClientRect(),w=$('roue');w.innerHTML=`<div class="titre">${o.nom}</div>`;
  for(const v of['regarder','prendre','utiliser','parler']){const b=document.createElement('button');b.innerHTML=`<span>${ICONES[v]}</span>${v[0].toUpperCase()+v.slice(1)}`;
    b.onclick=ev=>{ev.stopPropagation();const s0=S.sel;S.sel=null;executer(o,v)};w.appendChild(b)}
  w.style.left=Math.min(e.clientX-r.left,r.width-170)+'px';w.style.top=Math.max(0,e.clientY-r.top-60)+'px';w.hidden=false}
let appui=null,longOK=false;
cv.addEventListener('pointerdown',e=>{longOK=false;if(e.pointerType!=='mouse'){appui=setTimeout(()=>{const{o}=cible(e);if(o&&!S.busy&&!clicSuivant){longOK=true;ouvrirRoue(e,o)}},450)}});
cv.addEventListener('pointerup',()=>clearTimeout(appui));
cv.addEventListener('click',e=>{
  if(clicSuivant)return clicSuivant();
  if(longOK){longOK=false;return}
  if(!$('roue').hidden)return fermerRoue();
  if(S.busy||!$('choix').hidden)return;
  const{o,x}=cible(e);executer(o,undefined,x);
});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(S.busy||clicSuivant)return;const{o}=cible(e);if(o)ouvrirRoue(e,o);else fermerRoue()});
cv.addEventListener('mousemove',e=>{const t=$('etiquette');if(S.busy){t.hidden=true;return}const{o}=cible(e);
  if(!o){t.hidden=true;return}const r=$('scene').getBoundingClientRect(),v=verbeParDefaut(o);
  t.innerHTML=`<span>${ICONES[v==='donner'?'prendre':v]||''}</span> ${S.sel?OBJETS[S.sel].nom+' → ':''}${o.nom}`;
  t.style.left=(e.clientX-r.left+14)+'px';t.style.top=(e.clientY-r.top+10)+'px';t.hidden=false});
cv.addEventListener('mouseleave',()=>$('etiquette').hidden=true);
// Pour les tests : action(id, verbe?, objetSélectionné?)
async function action(id,v,sel){S.sel=sel||null;const o=objetsCliquables().find(o=>o.id===id);if(!o)throw new Error('introuvable: '+id+' dans '+S.scene);await agir(o,v);S.sel=null}

// ===== Graphisme : personnages animés et outils de dessin =====
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,v=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.round(r*f));v=Math.min(255,Math.round(v*f));b=Math.min(255,Math.round(b*f));
  return'#'+((1<<24)|(r<<16)|(v<<8)|b).toString(16).slice(1)}
const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
function vgrad(y0,y1,c1,c2,x0=0,w=W){const d=g.createLinearGradient(0,y0,0,y1);d.addColorStop(0,c1);d.addColorStop(1,c2);g.fillStyle=d;g.fillRect(x0,y0,w,y1-y0)}
function halo(x,y,r,c,a=.5){const d=g.createRadialGradient(x,y,0,x,y,r);d.addColorStop(0,c.replace(')',`,${a})`).replace('rgb','rgba'));d.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=d;g.fillRect(x-r,y-r,r*2,r*2)}
function vignette(){const d=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H);d.addColorStop(0,'rgba(0,0,0,0)');d.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=d;g.fillRect(0,0,W,H)}

// Apparence d'après les photos
const SPEC={
  yvan:{skin:'#d9a77c',hair:'#141414',coiffure:'court',top:'#3b2442',veste:'#1c1a1f',pants:'#2b2b33',shoes:'#111',lunettes:1,moust:'#2a2018',sac:1,capuche:1},
  rod:{skin:'#e8b896',hair:'#6b4528',coiffure:'boucle',top:'#c8242c',pants:'#24262e',shoes:'#e8e8e8',barbe:'#6e4a2c',capuche:1,blason:1},
  solene:{skin:'#f0c7a6',hair:'#4a2a1c',coiffure:'long',top:'#9a3328',pants:'#2a2a38',shoes:'#3a2a20',boucles:1,maille:1}};
S.anim={};
const anim=n=>S.anim[n]||(S.anim[n]={dir:'face',pas:0,marche:false});

function drawPerso(n,x,y=SOL){
  const s=SPEC[n],a=anim(n);x=Math.round(x);
  if(!S.reflet){g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(x,y,9,2.5,0,0,7);g.fill()}
  const f=a.marche?Math.floor(a.pas/5)%4:0,bob=f%2?-1:0;
  g.save();g.translate(x,y);if(a.dir==='g')g.scale(-1,1);
  if(a.dir==='g'||a.dir==='d')profil(s,f,bob);else face(s,f,bob,a.dir==='dos');
  g.restore();
  if(n===S.perso&&!TEST&&!S.reflet){const t=Date.now()/300;P(x-1,y-48+Math.round(Math.sin(t)),3,2,'#f0c766');P(x,y-46+Math.round(Math.sin(t)),1,1,'#f0c766')}
}
function cligne(){return(Date.now()/120|0)%35===0}
function face(s,f,bob,dos){
  const L=13,lg=f===1?2:0,ld=f===3?2:0,T=-L-15+bob,H0=T-11,ey=H0+5,arm=s.veste||shade(s.top,.85),sw=f===1?1:f===3?-1:0;
  // jambes
  P(-5,-L,4,L-2-lg,s.pants);P(1,-L,4,L-2-ld,s.pants);P(-2,-L,1,L-4,shade(s.pants,.75));P(4,-L,1,L-3,shade(s.pants,.8));
  P(-6,-2-lg,5,2,s.shoes);P(1,-2-ld,5,2,s.shoes);P(-6,-1-lg,5,1,shade(s.shoes,.7));P(1,-1-ld,5,1,shade(s.shoes,.7));
  if(s.coiffure==='long')P(-7,H0+2,14,16,shade(s.hair,.8));
  // bras
  P(-9,T+1+sw,2,11,arm);P(-9,T+12+sw,2,2,s.skin);P(7,T+1-sw,2,11,shade(arm,.85));P(7,T+12-sw,2,2,shade(s.skin,.9));
  // torse
  P(-7,T,14,15,s.top);P(-7,T,1,15,shade(s.top,1.2));P(6,T,1,15,shade(s.top,.8));P(-7,T+13,14,2,shade(s.top,.78));
  if(s.maille)for(let i=T+2;i<T+13;i+=3)for(let j=-6;j<6;j+=3)P(j,i,1,1,shade(s.top,.85));
  if(s.capuche){P(-5,T-1,10,2,shade(s.top,.8));P(0,T+1,1,12,shade(s.top,.65));if(!dos){P(-2,T+1,1,5,shade(s.top,1.35));P(2,T+1,1,5,shade(s.top,1.35))}
    P(-5,T+8,10,4,shade(s.top,.9))}
  if(s.veste){P(-7,T,4,15,s.veste);P(3,T,4,15,s.veste);P(-4,T,1,15,'#2e2b33');P(-6,T+3,1,1,'#888')}
  if(s.blason&&!dos){P(2,T+4,4,4,'#f2f2f2');P(3,T+5,2,1,s.top)}
  if(s.sac&&!dos){P(-6,T,2,9,'#d8473c');P(-6,T+2,2,1,'#f5d33b');P(-6,T+5,2,1,'#3b8ad8')}
  if(s.sac&&dos){P(-5,T+2,10,10,'#2d3e78');P(-5,T+2,10,1,'#4b62b0');P(-3,T+5,6,4,'#d8473c')}
  // tête
  P(-1,T-1,2,1,shade(s.skin,.85));P(-5,H0,10,10,s.skin);P(4,H0+1,1,9,shade(s.skin,.88));P(-5,H0+9,10,1,shade(s.skin,.9));
  P(-6,H0+4,1,2,s.skin);P(5,H0+4,1,2,shade(s.skin,.9));

// marche animée (remplace celle du moteur)
marcher=function(n,x){x=Math.max(8,Math.min(W-8,x));const a=anim(n);
  if(TEST){S.pos[n]=x;return Promise.resolve()}
  return new Promise(r=>{const pas=()=>{const d=x-S.pos[n];
    if(Math.abs(d)<1.5){S.pos[n]=x;a.marche=false;a.dir='face';return r()}
    a.marche=true;a.dir=d>0?'d':'g';a.pas++;S.pos[n]+=Math.sign(d)*Math.min(1.5,Math.abs(d));setTimeout(pas,16)};pas()})};

// Inspirations : Eastward / Sea of Stars (lumière dynamique), Owlboy (parallaxe),
// HD-2D façon Octopath (flou de profondeur), Dex (pluie et néons).
const cam=()=>((S.pos[S.perso]??160)-160)/160; // -1 … 1

// --- lumière : voile sombre percé par les sources, puis halo additif (bloom) ---
const LC=document.createElement('canvas');LC.width=W;LC.height=H;const lg=LC.getContext('2d');
function eclairer(sc){
  const A=sc.ambiance;if(!A)return;const L=typeof sc.lumieres==='function'?sc.lumieres():(sc.lumieres||[]);
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,W,H);lg.fillStyle=A.voile;lg.globalAlpha=A.nuit;lg.fillRect(0,0,W,H);lg.globalAlpha=1;
  lg.globalCompositeOperation='destination-out';
  for(const l of L){const v=l.vacille?1+Math.sin(Date.now()/90+l.x)*.06:1,d=lg.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r*v);
    d.addColorStop(0,'rgba(0,0,0,1)');d.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=d;lg.fillRect(l.x-l.r*1.1,l.y-l.r*1.1,l.r*2.2,l.r*2.2)}
  g.drawImage(LC,0,0);
  g.save();g.globalCompositeOperation='lighter';
  for(const l of L)if(l.c){const d=g.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r*.7);d.addColorStop(0,l.c);d.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=d;g.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2)}
  g.restore();
  if(A.teinte){g.save();g.globalCompositeOperation='soft-light';g.fillStyle=A.teinte;g.fillRect(0,0,W,H);g.restore()}
}
function faisceau(x1,w1,x2,w2,y1,y2,c){g.save();g.globalCompositeOperation='lighter';const d=g.createLinearGradient(0,y1,0,y2);d.addColorStop(0,c);d.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=d;g.beginPath();g.moveTo(x1,y1);g.lineTo(x1+w1,y1);g.lineTo(x2+w2,y2);g.lineTo(x2,y2);g.fill();g.restore()}

// --- particules ---
const PART=[];
function emettre(n,f){const k=f().k;let c=PART.filter(p=>p.k===k).length;while(c++<n)PART.push(f())}
function particules(sc){
  if(sc.particules)sc.particules();
  for(let i=PART.length-1;i>=0;i--){const p=PART[i];if(p.scene!==S.scene){PART.splice(i,1);continue}
    p.x+=p.vx;p.y+=p.vy;p.vie--;if(p.vie<=0||p.y>H||p.x<-5||p.x>W+5){PART.splice(i,1);continue}
    g.globalAlpha=Math.min(1,p.vie/30)*(p.a??1);g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),p.t,p.h??p.t);
    if(p.glow){g.globalAlpha*=.35;g.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,p.t+2,p.t+2)}}
  g.globalAlpha=1;
}
